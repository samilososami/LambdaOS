name: Bug report
description: Report a reproducible LambdaOS problem.
title: "[Bug]: "
body:
  - type: input
    id: device
    attributes:
      label: Device model and codename
      placeholder: Samsung Galaxy S10 SM-G973F / beyond1lte
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build or source revision
      description: Include the release identifier or Git commit, plus any local changes.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the actual result and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs or screenshots
      description: Remove credentials, network identifiers and other personal information before posting.
