name: Feature proposal
description: Suggest a LambdaOS capability or workflow.
title: "[Feature]: "
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: Describe the concrete workflow and why it matters.
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Device or external hardware involved
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include any useful examples or references.
